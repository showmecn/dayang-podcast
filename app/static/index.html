<!DOCTYPE html>
<html lang="zh-CN" data-theme="ocean">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大洋播客 — 发现好播客</title>
<meta name="description" content="最新播客推荐 + 随机发现 — 发现值得听的播客节目">
<style>
/* ========== Reset & Base ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,'Helvetica Neue',sans-serif;
  background:var(--bg-color);color:var(--text-color);line-height:1.6;
  min-height:100vh;display:flex;flex-direction:column;
  transition:background .3s,color .3s;
}
a{color:var(--accent-color);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible{outline:2px solid var(--accent-color);outline-offset:2px;border-radius:2px}

/* ========== CSS Variables — 5 Themes ========== */
/* --- 🌊 Ocean Deep Blue (default) --- */
:root,
[data-theme="ocean"]{
  --bg-color:#0a1628;
  --card-color:#1a2744;
  --text-color:#e0e8f0;
  --text-secondary:#94a3b8;
  --border-color:#1e3a5f;
  --accent-color:#3b82f6;
  --accent-hover:#2563eb;
  --accent-light:rgba(59,130,246,0.15);
  --badge-bg:#064e3b;
  --badge-color:#6ee7b7;
  --shadow:0 2px 12px rgba(0,0,0,.3);
  --header-border:#1e293b;
  --footer-text:#475569;
  --retry-bg:transparent;
  --retry-hover:#1e293b;
  --listen-bg:#334155;
  --listen-hover-bg:var(--accent-color);
  --listen-hover-text:#fff;
  --audio-bg:#334155;
  --tslist-border:var(--border-color);
  --tslist-item-border:#1e293b;
  --ts-time:var(--accent-color);
  --ts-label:var(--text-secondary);
  --reason-bg:var(--bg-color);
  --reason-text:var(--text-secondary);
  --disabled-bg:#475569;
  --badge-bg-alt:#064e3b;
  --badge-color-alt:#6ee7b7;
  --brand-accent:var(--accent-color);
  --logo-color:var(--accent-color);
  --picker-bg:rgba(255,255,255,.08);
  --swatch-ring:#fff;
}

/* --- 🌅 Sunset Warm Orange --- */
[data-theme="sunset"]{
  --bg-color:#1a0f0a;
  --card-color:#2d1f14;
  --text-color:#f0e0d0;
  --text-secondary:#c4a882;
  --border-color:#4a3520;
  --accent-color:#f59e0b;
  --accent-hover:#d97706;
  --accent-light:rgba(245,158,11,0.15);
  --badge-bg:#4a2800;
  --badge-color:#fbbf24;
  --shadow:0 2px 12px rgba(0,0,0,.35);
  --header-border:#3d2914;
  --footer-text:#6b5a45;
  --retry-bg:transparent;
  --retry-hover:#2d1f14;
  --listen-bg:#3d2b1a;
  --listen-hover-bg:var(--accent-color);
  --listen-hover-text:#1a0f0a;
  --audio-bg:#3d2b1a;
  --tslist-border:var(--border-color);
  --tslist-item-border:#2d1f14;
  --ts-time:var(--accent-color);
  --ts-label:var(--text-secondary);
  --reason-bg:var(--bg-color);
  --reason-text:var(--text-secondary);
  --disabled-bg:#5a4530;
  --badge-bg-alt:#4a2800;
  --badge-color-alt:#fbbf24;
  --brand-accent:var(--accent-color);
  --logo-color:var(--accent-color);
  --picker-bg:rgba(255,255,255,.06);
  --swatch-ring:#fff;
}

/* --- 🌿 Forest Green --- */
[data-theme="forest"]{
  --bg-color:#0a1a0f;
  --card-color:#142d1f;
  --text-color:#d0f0e0;
  --text-secondary:#7eb892;
  --border-color:#1a3d28;
  --accent-color:#34d399;
  --accent-hover:#10b981;
  --accent-light:rgba(52,211,153,0.15);
  --badge-bg:#064e3b;
  --badge-color:#6ee7b7;
  --shadow:0 2px 12px rgba(0,0,0,.3);
  --header-border:#142d1f;
  --footer-text:#3d5a4a;
  --retry-bg:transparent;
  --retry-hover:#142d1f;
  --listen-bg:#1a3d28;
  --listen-hover-bg:var(--accent-color);
  --listen-hover-text:#0a1a0f;
  --audio-bg:#1a3d28;
  --tslist-border:var(--border-color);
  --tslist-item-border:#142d1f;
  --ts-time:var(--accent-color);
  --ts-label:var(--text-secondary);
  --reason-bg:var(--bg-color);
  --reason-text:var(--text-secondary);
  --disabled-bg:#2a5038;
  --badge-bg-alt:#064e3b;
  --badge-color-alt:#6ee7b7;
  --brand-accent:var(--accent-color);
  --logo-color:var(--accent-color);
  --picker-bg:rgba(255,255,255,.06);
  --swatch-ring:#fff;
}

/* --- ☕ Coffee Brown --- */
[data-theme="coffee"]{
  --bg-color:#1a1410;
  --card-color:#2d221a;
  --text-color:#e8ddd0;
  --text-secondary:#b89f8a;
  --border-color:#3d3025;
  --accent-color:#a78bfa;
  --accent-hover:#8b5cf6;
  --accent-light:rgba(167,139,250,0.15);
  --badge-bg:#3b1f5e;
  --badge-color:#c4b5fd;
  --shadow:0 2px 12px rgba(0,0,0,.35);
  --header-border:#2d221a;
  --footer-text:#5a4a3a;
  --retry-bg:transparent;
  --retry-hover:#2d221a;
  --listen-bg:#3d3025;
  --listen-hover-bg:var(--accent-color);
  --listen-hover-text:#1a1410;
  --audio-bg:#3d3025;
  --tslist-border:var(--border-color);
  --tslist-item-border:#2d221a;
  --ts-time:var(--accent-color);
  --ts-label:var(--text-secondary);
  --reason-bg:var(--bg-color);
  --reason-text:var(--text-secondary);
  --disabled-bg:#4a3d32;
  --badge-bg-alt:#3b1f5e;
  --badge-color-alt:#c4b5fd;
  --brand-accent:var(--accent-color);
  --logo-color:var(--accent-color);
  --picker-bg:rgba(255,255,255,.06);
  --swatch-ring:#fff;
}

/* --- ⚪ Pure White --- */
[data-theme="white"]{
  --bg-color:#f5f5f5;
  --card-color:#ffffff;
  --text-color:#333333;
  --text-secondary:#64748b;
  --border-color:#e2e8f0;
  --accent-color:#2563eb;
  --accent-hover:#1d4ed8;
  --accent-light:rgba(37,99,235,0.08);
  --badge-bg:#f0fdf4;
  --badge-color:#059669;
  --shadow:0 2px 12px rgba(0,0,0,.06);
  --header-border:#e2e8f0;
  --footer-text:#94a3b8;
  --retry-bg:#fff;
  --retry-hover:#eff6ff;
  --listen-bg:#f1f5f9;
  --listen-hover-bg:var(--accent-color);
  --listen-hover-text:#fff;
  --audio-bg:#f1f5f9;
  --tslist-border:var(--border-color);
  --tslist-item-border:#f1f5f9;
  --ts-time:var(--accent-color);
  --ts-label:#475569;
  --reason-bg:#f8fafc;
  --reason-text:var(--text-secondary);
  --disabled-bg:#94a3b8;
  --badge-bg-alt:#f0fdf4;
  --badge-color-alt:#059669;
  --brand-accent:var(--accent-color);
  --logo-color:var(--accent-color);
  --picker-bg:rgba(0,0,0,.06);
  --swatch-ring:var(--bg-color);
}

/* ========== Layout ========== */
.container{max-width:680px;margin:0 auto;padding:0 16px;width:100%}

/* ========== Header ========== */
header{
  padding:24px 0 8px;border-bottom:1px solid var(--header-border);
  display:flex;align-items:center;justify-content:space-between;
}
.brand{
  display:flex;align-items:center;gap:8px;
  font-size:22px;font-weight:700;letter-spacing:-0.3px;color:var(--text-color);
}
.brand-icon{width:28px;height:28px;color:var(--logo-color);flex-shrink:0}
.brand span{color:var(--brand-accent)}
.header-tag{font-size:12px;color:var(--text-secondary);display:block;margin-top:2px}

/* ========== Theme Switcher ========== */
.theme-picker{
  display:flex;align-items:center;gap:4px;
  background:var(--picker-bg);border-radius:999px;padding:4px;
  flex-shrink:0;
}
.theme-swatch{
  width:22px;height:22px;border-radius:50%;
  border:2px solid transparent;cursor:pointer;
  transition:border-color .2s,transform .15s;flex-shrink:0;
  position:relative;
}
.theme-swatch:hover{transform:scale(1.15)}
.theme-swatch:focus-visible{
  outline:2px solid var(--accent-color);outline-offset:3px;border-radius:50%;
}
.theme-swatch[aria-checked="true"]{
  border-color:var(--swatch-ring);box-shadow:0 0 0 2px var(--accent-color);
}
.swatch-ocean{background:#3b82f6}
.swatch-sunset{background:#f59e0b}
.swatch-forest{background:#34d399}
.swatch-coffee{background:#a78bfa}
.swatch-white{background:#e2e8f0;border-color:rgba(0,0,0,.15)}
.theme-swatch.swatch-white[aria-checked="true"]{border-color:var(--swatch-ring)}
.theme-picker-label{font-size:11px;color:var(--text-secondary);margin-right:4px;display:none}

/* ========== Results area ========== */
.results{flex:1;padding-top:32px;padding-bottom:48px}

/* ========== Empty / Error ========== */
.empty-state,.error-state{text-align:center;padding:64px 16px}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:.6}
.empty-state h2,.error-state h2{font-size:20px;font-weight:600;margin-bottom:8px;color:var(--text-color)}
.empty-state p,.error-state p{color:var(--text-secondary);font-size:14px;max-width:360px;margin:0 auto}
.error-state .error-detail{color:#dc2626;font-size:13px;margin-top:8px;word-break:break-word}
.retry-btn{
  margin-top:16px;padding:10px 20px;font-size:14px;font-weight:600;
  border:1.5px solid var(--accent-color);border-radius:8px;background:var(--retry-bg);color:var(--accent-color);
  cursor:pointer;font-family:inherit;transition:background .15s;
}
.retry-btn:hover{background:var(--retry-hover)}
.retry-btn:focus-visible{outline:2px solid var(--accent-color);outline-offset:2px}

/* ========== Card ========== */
.cards{display:flex;flex-direction:column;gap:16px}
.card{
  background:var(--card-color);border:1px solid var(--border-color);border-radius:12px;padding:20px;
  transition:box-shadow .2s,background .3s,border-color .3s;position:relative;
}
.card:hover{box-shadow:var(--shadow)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.card-title{font-size:17px;font-weight:600;line-height:1.4;color:var(--text-color);flex:1}
.card-badge{
  font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;
  background:var(--badge-bg-alt);color:var(--badge-color-alt);white-space:nowrap;flex-shrink:0;margin-top:2px;
  letter-spacing:0.2px;
}
.card-meta{font-size:13px;color:var(--text-secondary);margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px 12px}
.card-meta .show-name{color:var(--text-color);font-weight:500}
.card-meta .sep{color:var(--border-color)}
.card-summary{font-size:14px;color:var(--text-color);line-height:1.6;margin-bottom:10px}
.card-reason{font-size:13px;color:var(--reason-text);font-style:italic;padding:8px 12px;background:var(--reason-bg);border-radius:8px;margin-bottom:10px;line-height:1.5}
.card-reason strong{font-style:normal;color:var(--text-color)}

/* ========== Timestamps accordion ========== */
.timestamps-toggle{
  display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--text-secondary);
  background:none;border:none;cursor:pointer;padding:4px 0;font-family:inherit;
  transition:color .15s;
}
.timestamps-toggle:hover{color:var(--accent-color)}
.timestamps-toggle:focus-visible{outline:2px solid var(--accent-color);outline-offset:2px;border-radius:4px}
.timestamps-toggle .arrow{transition:transform .2s;font-size:11px}
.timestamps-toggle[aria-expanded="true"] .arrow{transform:rotate(90deg)}
.timestamps-list{
  display:none;margin-top:8px;padding:0;list-style:none;
  border:1px solid var(--tslist-border);border-radius:8px;overflow:hidden;
}
.timestamps-list.open{display:block}
.timestamps-list li{
  display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:13px;color:var(--ts-label);
  border-bottom:1px solid var(--tslist-item-border);
}
.timestamps-list li:last-child{border-bottom:none}
.ts-time{font-family:'SF Mono',Monaco,Consolas,'Liberation Mono',monospace;font-size:12px;color:var(--ts-time);font-weight:500;white-space:nowrap;min-width:48px}
.ts-label{color:var(--ts-label)}

/* ========== Audio player ========== */
.card-audio{
  margin-top:12px;width:100%;
}
.card-audio audio{
  display:block;width:100%;height:44px;border-radius:8px;
  background:var(--audio-bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.04);
}
.card-audio audio:focus-visible{
  outline:2px solid var(--accent-color);outline-offset:2px;border-radius:8px;
}

/* ========== Listen button ========== */
.listen-btn{
  display:inline-flex;align-items:center;gap:6px;margin-top:12px;
  padding:8px 16px;font-size:13px;font-weight:600;border:none;border-radius:8px;
  background:var(--listen-bg);color:var(--text-color);cursor:pointer;font-family:inherit;
  transition:background .15s,color .15s;
}
.listen-btn:hover{background:var(--listen-hover-bg);color:var(--listen-hover-text);text-decoration:none}
.listen-btn:focus-visible{outline:2px solid var(--accent-color);outline-offset:2px}

/* ========== Action row — two buttons side by side ========== */
.action-row{
  display:flex;justify-content:center;gap:12px;
  margin-bottom:24px;flex-wrap:wrap;
}
.action-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 28px;font-size:15px;font-weight:600;border:none;border-radius:12px;
  color:#fff;cursor:pointer;font-family:inherit;
  min-width:140px;transition:background .15s,opacity .15s,transform .1s;
}
.action-btn:active{transform:scale(.97)}
.action-btn:focus-visible{outline:2px solid var(--accent-color);outline-offset:2px}
.action-btn:disabled{background:var(--disabled-bg);cursor:not-allowed;opacity:.7;transform:none}
.random-btn{background:var(--accent-color)}
.random-btn:hover:not(:disabled){background:var(--accent-hover)}
.latest-btn{background:#059669}
.latest-btn:hover:not(:disabled){background:#047857}

/* ========== Loading state ========== */
.loading-state{text-align:center;padding:48px 16px}
.loading-spinner{display:inline-flex;gap:8px;margin-bottom:12px}
.loading-dot{
  width:10px;height:10px;border-radius:50%;background:var(--accent-color);
  animation:dot-pulse 1.2s ease-in-out infinite;
}
.loading-dot:nth-child(2){animation-delay:.4s}
@keyframes dot-pulse{
  0%,80%,100%{opacity:.3;transform:scale(.8)}
  40%{opacity:1;transform:scale(1)}
}
.loading-text{font-size:14px;color:var(--text-secondary)}

/* ========== Random results ========== */
#randomResults{margin-top:8px}
.section-divider{border:none;border-top:1px solid var(--border-color);margin:0 0 20px}

/* ========== Footer ========== */
footer{text-align:center;padding:24px 0;font-size:12px;color:var(--footer-text);border-top:1px solid var(--header-border);margin-top:auto}

/* ========== Utility ========== */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

/* ========== Processing time ========== */
.processing-info{text-align:center;font-size:12px;color:var(--text-secondary);margin-top:12px}

/* ========== Latest heading ========== */
#latestHeading h2{font-size:18px;font-weight:600;color:var(--text-color);margin-bottom:16px}

/* ========== Motion reduce ========== */
@media (prefers-reduced-motion:reduce){
  *,.card,.listen-btn,.card-audio audio,.action-btn,.retry-btn,.theme-swatch,.brand-icon,.brand{transition:none!important}
  .loading-dot{animation:none;opacity:.6}
}

/* ========== Responsive ========== */
@media (max-width:480px){
  header{padding:16px 0 8px}
  .brand{font-size:18px;gap:6px}
  .brand-icon{width:24px;height:24px}
  .theme-picker{gap:3px;padding:3px}
  .theme-swatch{width:18px;height:18px}
  .results{padding-top:24px}
  .card{padding:16px}
  .card-header{flex-direction:column;gap:4px}
  .card-badge{align-self:flex-start}
  .action-row{gap:8px}
  .action-btn{padding:10px 20px;font-size:14px;min-width:120px}
  .loading-state{padding:36px 16px}
}
</style>
</head>
<body>

<header>
  <div class="container" style="display:flex;align-items:center;justify-content:space-between">
    <div>
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <!-- Ocean wave (left) -->
          <path d="M2 16 C6 8 10 24 14 16 C18 8 22 24 26 16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.9"/>
          <!-- Sound bars (right, emerging from wave) -->
          <rect x="8" y="10" width="2.5" height="9" rx="1.25" fill="currentColor" opacity="0.4"/>
          <rect x="12.5" y="7" width="2.5" height="15" rx="1.25" fill="currentColor" opacity="0.8"/>
          <rect x="17" y="11.5" width="2.5" height="6" rx="1.25" fill="currentColor" opacity="0.55"/>
          <rect x="21.5" y="9" width="2.5" height="11" rx="1.25" fill="currentColor" opacity="0.7"/>
        </svg>
        大洋<span>播客</span>
      </div>
      <span class="header-tag">发现好播客</span>
    </div>
    <!-- Theme Switcher -->
    <div class="theme-picker" role="radiogroup" aria-label="配色主题切换">
      <span class="theme-picker-label">主题</span>
      <button class="theme-swatch swatch-ocean"    role="radio" aria-checked="true"  aria-label="切换至海洋深蓝" data-theme-val="ocean"  title="海洋深蓝"></button>
      <button class="theme-swatch swatch-sunset"   role="radio" aria-checked="false" aria-label="切换至日落暖橙" data-theme-val="sunset" title="日落暖橙"></button>
      <button class="theme-swatch swatch-forest"   role="radio" aria-checked="false" aria-label="切换至森林绿"   data-theme-val="forest" title="森林绿"></button>
      <button class="theme-swatch swatch-coffee"   role="radio" aria-checked="false" aria-label="切换至咖啡棕"   data-theme-val="coffee" title="咖啡棕"></button>
      <button class="theme-swatch swatch-white"    role="radio" aria-checked="false" aria-label="切换至纯净白"   data-theme-val="white"  title="纯净白"></button>
    </div>
  </div>
</header>

<main>
  <section class="results" id="results" aria-label="播客推荐" aria-live="polite" aria-atomic="true">
    <div class="container">
      <!-- Default: Welcome state (shown on first visit) -->
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🎲</div>
        <h2>欢迎来到大洋播客</h2>
        <p>浏览最新播客，或点击「随便听听」发现随机好内容</p>
      </div>

      <!-- Error state -->
      <div class="error-state" id="errorState" hidden>
        <div class="empty-icon">⚠️</div>
        <h2>加载失败</h2>
        <p id="errorMessage">请稍后重试</p>
        <div class="error-detail" id="errorDetail"></div>
        <button class="retry-btn" id="retryBtn">🔄 重新加载</button>
      </div>

      <!-- Empty state (shown when latest API returns no data) -->
      <div class="empty-state" id="emptyLatestState" hidden>
        <div class="empty-icon">📭</div>
        <h2>暂无最新播客</h2>
        <p>播客源暂时没有新内容，稍后再来看看</p>
        <button class="retry-btn" id="emptyLatestRetryBtn">🔄 重新加载</button>
      </div>

      <!-- Action row: two buttons side by side -->
      <div class="action-row" id="actionRow">
        <button class="action-btn random-btn" id="randomBtn" type="button" aria-label="随机发现播客">🎲 随便听听</button>
        <button class="action-btn latest-btn" id="latestBtn" type="button" aria-label="加载最新播客">📻 最新播客</button>
      </div>

      <hr class="section-divider" id="sectionDivider" hidden aria-hidden="true">

      <!-- Loading state (shown on page load and on manual refresh) -->
      <div class="loading-state" id="loadingState" hidden aria-label="正在加载">
        <div class="loading-spinner" aria-hidden="true">
          <span class="loading-dot"></span>
          <span class="loading-dot"></span>
        </div>
        <div class="loading-text" id="loadingText">📻 正在加载最新播客…</div>
      </div>

      <!-- Latest episodes heading -->
      <div id="latestHeading" hidden aria-label="最新播客">
        <h2>📻 最新播客</h2>
      </div>

      <!-- Latest cards container -->
      <div id="cardsContainer" hidden aria-label="最新播客列表">
        <div class="cards" id="cardsList" role="list"></div>
        <div class="processing-info" id="processingInfo"></div>
      </div>

      <!-- Random results -->
      <div id="randomResults" hidden aria-label="随机播客列表">
        <div class="cards" id="randomCards" role="list"></div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="container">大洋播客 · 发现好播客</div>
</footer>

<script>
(function() {
  'use strict';

  /* ---- Theme switcher ---- */
  (function initTheme() {
    var saved = localStorage.getItem('theme');
    if (saved && ['ocean','sunset','forest','coffee','white'].indexOf(saved) !== -1) {
      document.documentElement.setAttribute('data-theme', saved);
    }
    // Sync swatch aria-checked
    var current = document.documentElement.getAttribute('data-theme') || 'ocean';
    var swatches = document.querySelectorAll('.theme-swatch');
    swatches.forEach(function(s) {
      var checked = s.getAttribute('data-theme-val') === current;
      s.setAttribute('aria-checked', checked);
    });
  })();

  document.addEventListener('click', function(e) {
    var swatch = e.target.closest('.theme-swatch');
    if (!swatch) return;
    var theme = swatch.getAttribute('data-theme-val');
    if (!theme) return;

    // Set theme
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);

    // Update aria-checked
    var swatches = document.querySelectorAll('.theme-swatch');
    swatches.forEach(function(s) {
      s.setAttribute('aria-checked', s.getAttribute('data-theme-val') === theme);
    });
  });

  /* ---- Keyboard support for theme switcher ---- */
  document.addEventListener('keydown', function(e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    var active = document.activeElement;
    if (!active || !active.classList.contains('theme-swatch')) return;

    var swatches = Array.from(document.querySelectorAll('.theme-swatch'));
    var idx = swatches.indexOf(active);
    if (idx === -1) return;

    e.preventDefault();
    var next = (e.key === 'ArrowRight')
      ? (idx + 1) % swatches.length
      : (idx - 1 + swatches.length) % swatches.length;
    swatches[next].focus();
    swatches[next].click();
  });

  /* ---- DOM refs ---- */
  var DOM = {
    emptyState: document.getElementById('emptyState'),
    emptyLatestState: document.getElementById('emptyLatestState'),
    emptyLatestRetryBtn: document.getElementById('emptyLatestRetryBtn'),
    errorState: document.getElementById('errorState'),
    errorMessage: document.getElementById('errorMessage'),
    errorDetail: document.getElementById('errorDetail'),
    retryBtn: document.getElementById('retryBtn'),
    cardsContainer: document.getElementById('cardsContainer'),
    cardsList: document.getElementById('cardsList'),
    processingInfo: document.getElementById('processingInfo'),
    results: document.getElementById('results'),
    latestHeading: document.getElementById('latestHeading'),
    sectionDivider: document.getElementById('sectionDivider'),
    randomBtn: document.getElementById('randomBtn'),
    randomResults: document.getElementById('randomResults'),
    randomCards: document.getElementById('randomCards'),
    latestBtn: document.getElementById('latestBtn'),
    loadingState: document.getElementById('loadingState'),
    loadingText: document.getElementById('loadingText'),
  };

  var abortController = null;
  var latestWasLoaded = false;

  /* ---- Loading state ---- */
  function showLoading(text) {
    DOM.loadingState.hidden = false;
    DOM.loadingText.textContent = text || '📻 正在加载最新播客…';
    DOM.emptyState.hidden = true;
    DOM.emptyLatestState.hidden = true;
    DOM.errorState.hidden = true;
    DOM.cardsContainer.hidden = true;
    DOM.latestHeading.hidden = true;
    DOM.sectionDivider.hidden = true;
    DOM.randomResults.hidden = true;
  }

  function hideLoading() {
    DOM.loadingState.hidden = true;
  }

  /* ---- State management ---- */
  function showError(message, detail) {
    hideLoading();
    DOM.emptyState.hidden = true;
    DOM.emptyLatestState.hidden = true;
    DOM.cardsContainer.hidden = true;
    DOM.latestHeading.hidden = true;
    DOM.sectionDivider.hidden = true;
    DOM.randomResults.hidden = true;
    DOM.errorState.hidden = false;
    DOM.errorMessage.textContent = message || '加载失败，请稍后重试';
    DOM.errorDetail.textContent = detail || '';
    DOM.randomBtn.disabled = false;
    DOM.randomBtn.textContent = '🎲 随便听听';
    DOM.latestBtn.disabled = false;
    DOM.latestBtn.textContent = '📻 最新播客';
  }

  function showEmptyState(title, desc) {
    hideLoading();
    DOM.emptyState.hidden = false;
    DOM.emptyLatestState.hidden = true;
    DOM.errorState.hidden = true;
    DOM.cardsContainer.hidden = true;
    DOM.latestHeading.hidden = true;
    DOM.sectionDivider.hidden = true;
    DOM.randomResults.hidden = true;
    DOM.randomBtn.disabled = false;
    DOM.randomBtn.textContent = '🎲 随便听听';
    DOM.latestBtn.disabled = false;
    DOM.latestBtn.textContent = '📻 最新播客';
    DOM.emptyState.querySelector('h2').textContent = title;
    DOM.emptyState.querySelector('p').textContent = desc;
  }

  function showLatestEmptyState() {
    hideLoading();
    DOM.emptyState.hidden = true;
    DOM.emptyLatestState.hidden = false;
    DOM.errorState.hidden = true;
    DOM.cardsContainer.hidden = true;
    DOM.latestHeading.hidden = true;
    DOM.sectionDivider.hidden = true;
    DOM.randomResults.hidden = true;
    DOM.randomBtn.disabled = false;
    DOM.randomBtn.textContent = '🎲 随便听听';
    DOM.latestBtn.disabled = false;
    DOM.latestBtn.textContent = '📻 最新播客';
  }

  function restoreLatestView() {
    hideLoading();
    DOM.emptyState.hidden = true;
    DOM.emptyLatestState.hidden = true;
    DOM.errorState.hidden = true;
    DOM.randomResults.hidden = true;
    DOM.latestHeading.hidden = false;
    DOM.cardsContainer.hidden = false;
    DOM.sectionDivider.hidden = false;
    DOM.randomBtn.disabled = false;
    DOM.randomBtn.textContent = '🎲 随便听听';
    DOM.latestBtn.disabled = false;
    DOM.latestBtn.textContent = '📻 最新播客';
    DOM.results.setAttribute('aria-busy', 'false');
  }

  function restoreEmptyView() {
    hideLoading();
    DOM.emptyState.hidden = false;
    DOM.emptyLatestState.hidden = true;
    DOM.errorState.hidden = true;
    DOM.randomResults.hidden = true;
    DOM.latestHeading.hidden = true;
    DOM.cardsContainer.hidden = true;
    DOM.sectionDivider.hidden = true;
    DOM.randomBtn.disabled = false;
    DOM.randomBtn.textContent = '🎲 随便听听';
    DOM.latestBtn.disabled = false;
    DOM.latestBtn.textContent = '📻 最新播客';
    DOM.results.setAttribute('aria-busy', 'false');
  }

  function renderCards(recs, targetList) {
    targetList.innerHTML = '';
    targetList.setAttribute('role', 'list');

    recs.forEach(function(rec, idx) {
      var card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('role', 'listitem');
      card.setAttribute('aria-posinset', idx + 1);
      card.setAttribute('aria-setsize', recs.length);

      var scoreLabel = '';
      if (rec.relevance_score != null) {
        var pct = Math.round(rec.relevance_score * 100);
        scoreLabel = '匹配 ' + pct + '%';
      }

      var durationStr = '';
      if (rec.duration_sec != null && rec.duration_sec > 0) {
        var mins = Math.floor(rec.duration_sec / 60);
        if (mins >= 60) {
          var h = Math.floor(mins / 60);
          var m = mins % 60;
          durationStr = h + '小时' + (m > 0 ? m + '分钟' : '');
        } else {
          durationStr = mins + '分钟';
        }
      }

      var dateStr = rec.published_at || '';
      if (dateStr) {
        try {
          var d = new Date(dateStr);
          if (!isNaN(d.getTime())) {
            dateStr = d.toLocaleDateString('zh-CN', {year:'numeric',month:'short',day:'numeric'});
          }
        } catch(e) {}
      }

      var hasTimestamps = rec.timestamps && rec.timestamps.length > 0;

      var html = '';

      /* Header */
      html += '<div class="card-header">';
      html += '  <div class="card-title">' + escapeHtml(rec.episode_title || '未命名播客') + '</div>';
      if (scoreLabel) {
        html += '  <span class="card-badge">' + scoreLabel + '</span>';
      }
      html += '</div>';

      /* Meta */
      html += '<div class="card-meta">';
      if (rec.show_title) {
        html += '  <span class="show-name">' + escapeHtml(rec.show_title) + '</span>';
        if (dateStr || durationStr) html += '  <span class="sep">·</span>';
      }
      if (dateStr) {
        html += '  <span>' + dateStr + '</span>';
        if (durationStr) html += '  <span class="sep">·</span>';
      }
      if (durationStr) html += '  <span>' + durationStr + '</span>';
      html += '</div>';

      /* Summary */
      if (rec.summary) {
        html += '<div class="card-summary">' + escapeHtml(rec.summary) + '</div>';
      }

      /* Reason */
      if (rec.reason) {
        html += '<div class="card-reason"><strong>推荐理由</strong> · ' + escapeHtml(rec.reason) + '</div>';
      }

      /* Timestamps */
      if (hasTimestamps) {
        var tsId = 'ts-' + idx;
        html += '<div class="timestamps-section">';
        html += '  <button class="timestamps-toggle" aria-expanded="false" aria-controls="' + tsId + '" data-ts-target="' + tsId + '">';
        html += '    <span class="arrow">▶</span> 关键时间戳 (' + rec.timestamps.length + ')';
        html += '  </button>';
        html += '  <ul class="timestamps-list" id="' + tsId + '" role="list">';
        rec.timestamps.forEach(function(ts) {
          html += '    <li>';
          html += '      <span class="ts-time">' + escapeHtml(ts.time_str || '') + '</span>';
          html += '      <span class="ts-label">' + escapeHtml(ts.label || '') + '</span>';
          html += '    </li>';
        });
        html += '  </ul>';
        html += '</div>';
      }

      /* Audio player */
      if (rec.audio_url) {
        html += '<div class="card-audio">';
        html += '  <audio controls preload="none" aria-label="播客音频播放器 - ' + escapeAttr(rec.episode_title || '') + '">';
        html += '    <source src="' + escapeAttr(rec.audio_url) + '" type="audio/mpeg">';
        html += '    您的浏览器不支持音频播放';
        html += '  </audio>';
        html += '</div>';
      }

      /* Listen button */
      if (rec.episode_url) {
        html += '<a class="listen-btn" href="' + escapeAttr(rec.episode_url) + '" target="_blank" rel="noopener noreferrer">';
        html += '  🎧 收听原播客';
        html += '</a>';
      }

      card.innerHTML = html;

      /* Attach timestamp toggle events */
      if (hasTimestamps) {
        var toggleBtn = card.querySelector('.timestamps-toggle');
        var tsList = card.querySelector('.timestamps-list');
        if (toggleBtn && tsList) {
          toggleBtn.addEventListener('click', function() {
            var expanded = toggleBtn.getAttribute('aria-expanded') === 'true';
            toggleBtn.setAttribute('aria-expanded', !expanded);
            tsList.classList.toggle('open');
          });
        }
      }

      targetList.appendChild(card);
    });
  }

  function showLatestCards(recs) {
    hideLoading();
    DOM.emptyState.hidden = true;
    DOM.emptyLatestState.hidden = true;
    DOM.errorState.hidden = true;
    DOM.latestHeading.hidden = false;
    DOM.cardsContainer.hidden = false;
    DOM.sectionDivider.hidden = false;
    DOM.processingInfo.hidden = true;
    DOM.results.setAttribute('aria-busy', 'false');
    renderCards(recs, DOM.cardsList);
    latestWasLoaded = true;
    DOM.randomBtn.disabled = false;
    DOM.randomBtn.textContent = '🎲 随便听听';
    DOM.latestBtn.disabled = false;
    DOM.latestBtn.textContent = '📻 最新播客';
  }

  /* ---- Fetch latest (shared by auto-fetch and manual refresh) ---- */
  function doFetchLatest() {
    if (abortController) abortController.abort();
    abortController = new AbortController();

    DOM.latestBtn.disabled = true;
    DOM.latestBtn.textContent = '📻 加载中…';
    DOM.results.setAttribute('aria-busy', 'true');

    /* Hide random results */
    DOM.randomResults.hidden = true;

    showLoading('📻 正在加载最新播客…');

    var timeoutId = setTimeout(function() {
      if (abortController) {
        abortController.abort();
        abortController = null;
      }
      showError('请求超时', '服务器未在 10 秒内响应，请稍后重试');
    }, 10000);

    fetch('https://api.myagent.ccwu.cc/api/latest?limit=5', {
      headers: {'Accept': 'application/json'},
      signal: abortController.signal,
    })
    .then(function(response) {
      clearTimeout(timeoutId);
      if (!response.ok) throw new Error('服务器错误 (' + response.status + ')');
      return response.json();
    })
    .then(function(data) {
      abortController = null;
      var recs = data.recommendations || [];
      if (recs.length > 0) {
        showLatestCards(recs);
      } else {
        showLatestEmptyState();
        latestWasLoaded = false;
      }
    })
    .catch(function(err) {
      abortController = null;
      clearTimeout(timeoutId);
      DOM.randomBtn.disabled = false;
      DOM.randomBtn.textContent = '🎲 随便听听';
      DOM.latestBtn.disabled = false;
      DOM.latestBtn.textContent = '📻 最新播客';
      DOM.results.setAttribute('aria-busy', 'false');
      if (err.name === 'AbortError') return;
      showError('加载失败', err.message);
    });
  }

  /* ---- Random fetch ---- */
  function fetchRandom() {
    /* Cancel any in-flight request */
    if (abortController) abortController.abort();
    abortController = new AbortController();

    /* Disable only random button (latest stays independent) */
    DOM.randomBtn.disabled = true;
    DOM.randomBtn.textContent = '🎲 加载中…';
    DOM.results.setAttribute('aria-busy', 'true');

    /* Hide loading state if latest is loading */
    hideLoading();

    /* Hide latest section */
    DOM.latestHeading.hidden = true;
    DOM.cardsContainer.hidden = true;
    DOM.sectionDivider.hidden = true;

    /* Hide previous random results, empty/error states, and latest empty state */
    DOM.randomResults.hidden = true;
    DOM.emptyState.hidden = true;
    DOM.emptyLatestState.hidden = true;
    DOM.errorState.hidden = true;

    var timeoutId = setTimeout(function() {
      if (abortController) {
        abortController.abort();
        abortController = null;
      }
      /* Timeout: restore previous view silently */
      DOM.randomBtn.disabled = false;
      DOM.randomBtn.textContent = '🎲 随便听听';
      DOM.results.setAttribute('aria-busy', 'false');
      if (latestWasLoaded) {
        restoreLatestView();
      } else {
        restoreEmptyView();
      }
    }, 10000);

    fetch('https://api.myagent.ccwu.cc/api/random', {
      headers: { 'Accept': 'application/json' },
      signal: abortController.signal,
    })
    .then(function(response) {
      clearTimeout(timeoutId);
      if (!response.ok) throw new Error('服务器错误 (' + response.status + ')');
      return response.json();
    })
    .then(function(data) {
      abortController = null;
      clearTimeout(timeoutId);
      DOM.randomBtn.disabled = false;
      DOM.randomBtn.textContent = '🎲 随便听听';

      var recs = data.recommendations || [];
      if (recs.length === 0) {
        /* Empty random results — restore previous view */
        if (latestWasLoaded) {
          restoreLatestView();
        } else {
          restoreEmptyView();
        }
      } else {
        /* Show random cards (max 4) */
        var showRecs = recs.slice(0, 4);
        renderCards(showRecs, DOM.randomCards);
        DOM.randomResults.hidden = false;
        DOM.results.setAttribute('aria-busy', 'false');
      }
    })
    .catch(function(err) {
      abortController = null;
      clearTimeout(timeoutId);
      DOM.randomBtn.disabled = false;
      DOM.randomBtn.textContent = '🎲 随便听听';
      if (err.name === 'AbortError') return;
      /* On error: restore latest if available, otherwise empty state */
      if (latestWasLoaded) {
        restoreLatestView();
      } else {
        restoreEmptyView();
      }
    });
  }

  /* ---- Event handlers ---- */
  DOM.retryBtn.addEventListener('click', function() {
    doFetchLatest();
  });

  DOM.randomBtn.addEventListener('click', function() {
    fetchRandom();
  });

  DOM.latestBtn.addEventListener('click', function() {
    doFetchLatest();
  });

  DOM.emptyLatestRetryBtn.addEventListener('click', function() {
    doFetchLatest();
  });

  /* ---- Utility ---- */
  function escapeHtml(str) {
    if (typeof str !== 'string') return str;
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  function escapeAttr(str) {
    if (typeof str !== 'string') return '';
    return str.replace(/&/g,'&amp;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  /* Init: restore theme + auto-fetch latest with visible loading */
  document.addEventListener('DOMContentLoaded', function() {
    showLoading('📻 正在加载最新播客…');
    doFetchLatest();
  });

})();
</script>
</body>
</html>
