<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大洋播客 — 发现好播客</title>
<meta name="description" content="最新播客推荐 + 随机发现 — 发现值得听的播客节目">
<style>
/* ========== Reset & Base ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,'Helvetica Neue',sans-serif;
  background:#f8fafc;color:#0f172a;line-height:1.6;
  min-height:100vh;display:flex;flex-direction:column;
}
a{color:#2563eb;text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible{outline:2px solid #2563eb;outline-offset:2px;border-radius:2px}
/* ========== Layout ========== */
.container{max-width:680px;margin:0 auto;padding:0 16px;width:100%}
/* ========== Header ========== */
header{
  padding:24px 0 8px;border-bottom:1px solid #e2e8f0;
  display:flex;align-items:center;justify-content:space-between;
}
.brand{font-size:20px;font-weight:600;letter-spacing:-0.3px;color:#0f172a}
.brand span{color:#2563eb}
.header-tag{font-size:12px;color:#94a3b8}
/* ========== Results area ========== */
.results{flex:1;padding-top:32px;padding-bottom:48px}
/* ========== Empty / Error ========== */
.empty-state,.error-state{text-align:center;padding:64px 16px}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:.6}
.empty-state h2,.error-state h2{font-size:20px;font-weight:600;margin-bottom:8px;color:#0f172a}
.empty-state p,.error-state p{color:#64748b;font-size:14px;max-width:360px;margin:0 auto}
.error-state .error-detail{color:#dc2626;font-size:13px;margin-top:8px;word-break:break-word}
.retry-btn{
  margin-top:16px;padding:10px 20px;font-size:14px;font-weight:600;
  border:1.5px solid #2563eb;border-radius:8px;background:#fff;color:#2563eb;
  cursor:pointer;font-family:inherit;transition:background .15s;
}
.retry-btn:hover{background:#eff6ff}
.retry-btn:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
/* ========== Card ========== */
.cards{display:flex;flex-direction:column;gap:16px}
.card{
  background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;
  transition:box-shadow .2s;position:relative;
}
.card:hover{box-shadow:0 2px 12px rgba(0,0,0,.06)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.card-title{font-size:17px;font-weight:600;line-height:1.4;color:#0f172a;flex:1}
.card-badge{
  font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;
  background:#f0fdf4;color:#059669;white-space:nowrap;flex-shrink:0;margin-top:2px;
  letter-spacing:0.2px;
}
.card-meta{font-size:13px;color:#64748b;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px 12px}
.card-meta .show-name{color:#475569;font-weight:500}
.card-meta .sep{color:#cbd5e1}
.card-summary{font-size:14px;color:#334155;line-height:1.6;margin-bottom:10px}
.card-reason{font-size:13px;color:#64748b;font-style:italic;padding:8px 12px;background:#f8fafc;border-radius:8px;margin-bottom:10px;line-height:1.5}
.card-reason strong{font-style:normal;color:#475569}
/* ========== Timestamps accordion ========== */
.timestamps-toggle{
  display:inline-flex;align-items:center;gap:4px;font-size:13px;color:#64748b;
  background:none;border:none;cursor:pointer;padding:4px 0;font-family:inherit;
  transition:color .15s;
}
.timestamps-toggle:hover{color:#2563eb}
.timestamps-toggle:focus-visible{outline:2px solid #2563eb;outline-offset:2px;border-radius:4px}
.timestamps-toggle .arrow{transition:transform .2s;font-size:11px}
.timestamps-toggle[aria-expanded="true"] .arrow{transform:rotate(90deg)}
.timestamps-list{
  display:none;margin-top:8px;padding:0;list-style:none;
  border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;
}
.timestamps-list.open{display:block}
.timestamps-list li{
  display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:13px;color:#334155;
  border-bottom:1px solid #f1f5f9;
}
.timestamps-list li:last-child{border-bottom:none}
.ts-time{font-family:'SF Mono',Monaco,Consolas,'Liberation Mono',monospace;font-size:12px;color:#2563eb;font-weight:500;white-space:nowrap;min-width:48px}
.ts-label{color:#475569}
/* ========== Audio player ========== */
.card-audio{
  margin-top:12px;width:100%;
}
.card-audio audio{
  display:block;width:100%;height:44px;border-radius:8px;
  background:#f1f5f9;box-shadow:inset 0 1px 2px rgba(0,0,0,.04);
}
.card-audio audio:focus-visible{
  outline:2px solid #2563eb;outline-offset:2px;border-radius:8px;
}
/* ========== Listen button ========== */
.listen-btn{
  display:inline-flex;align-items:center;gap:6px;margin-top:12px;
  padding:8px 16px;font-size:13px;font-weight:600;border:none;border-radius:8px;
  background:#f1f5f9;color:#0f172a;cursor:pointer;font-family:inherit;
  transition:background .15s,color .15s;
}
.listen-btn:hover{background:#2563eb;color:#fff;text-decoration:none}
.listen-btn:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
/* ========== Random browse button — now above latest section ========== */
.random-section{
  text-align:center;margin:0 0 24px;
  padding:8px 0 0;
}
.random-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 40px;font-size:17px;font-weight:600;border:none;border-radius:12px;
  background:#2563eb;color:#fff;cursor:pointer;font-family:inherit;
  transition:background .15s,transform .1s,opacity .15s;min-width:200px;
}
.random-btn:hover{background:#1d4ed8}
.random-btn:active{transform:scale(.97)}
.random-btn:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
.random-btn:disabled{background:#94a3b8;cursor:not-allowed;opacity:.7}
/* ========== Random results ========== */
#randomResults{margin-top:8px}
/* ========== Section divider ========== */
.section-divider{border:none;border-top:1px solid #e2e8f0;margin:0 0 20px}
/* ========== Footer ========== */
footer{text-align:center;padding:24px 0;font-size:12px;color:#94a3b8;border-top:1px solid #e2e8f0;margin-top:auto}
/* ========== Utility ========== */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
/* ========== Processing time ========== */
.processing-info{text-align:center;font-size:12px;color:#94a3b8;margin-top:12px}
/* ========== Latest heading ========== */
#latestHeading h2{font-size:18px;font-weight:600;color:#0f172a;margin-bottom:16px}
/* ========== Motion reduce ========== */
@media (prefers-reduced-motion:reduce){
  .card,.listen-btn,.card-audio audio,.random-btn,.retry-btn{transition:none}
}
/* ========== Dark mode ========== */
@media (prefers-color-scheme:dark){
  body{background:#0f172a;color:#f1f5f9}
  .brand{color:#f1f5f9}
  .card{background:#1e293b;border-color:#334155}
  .card:hover{box-shadow:0 2px 12px rgba(0,0,0,.3)}
  .card-title{color:#f1f5f9}
  .card-meta{color:#94a3b8}
  .card-meta .show-name{color:#cbd5e1}
  .card-summary{color:#cbd5e1}
  .card-reason{background:#0f172a;color:#94a3b8}
  .card-reason strong{color:#cbd5e1}
  .timestamps-list{border-color:#334155}
  .timestamps-list li{color:#cbd5e1;border-bottom-color:#1e293b}
  .ts-time{color:#60a5fa}
  .ts-label{color:#94a3b8}
  .card-audio audio{background:#334155}
  .listen-btn{background:#334155;color:#f1f5f9}
  .listen-btn:hover{background:#2563eb;color:#fff}
  .card-badge{background:#064e3b;color:#6ee7b7}
  .empty-state h2,.error-state h2{color:#f1f5f9}
  .empty-state p,.error-state p{color:#94a3b8}
  .retry-btn{border-color:#3b82f6;color:#60a5fa;background:transparent}
  .retry-btn:hover{background:#1e293b}
  .processing-info{color:#64748b}
  #latestHeading h2{color:#f1f5f9}
  header{border-color:#1e293b}
  .header-tag{color:#475569}
  footer{border-color:#1e293b;color:#475569}
  .random-btn{background:#3b82f6}
  .random-btn:hover{background:#2563eb}
  .random-btn:disabled{background:#475569}
  .section-divider{border-top-color:#1e293b}
}
/* ========== Responsive ========== */
@media (max-width:480px){
  header{padding:16px 0 8px}
  .results{padding-top:24px}
  .card{padding:16px}
  .card-header{flex-direction:column;gap:4px}
  .card-badge{align-self:flex-start}
  .random-section{margin:0 0 16px;padding:4px 0 0}
  .random-btn{padding:12px 32px;font-size:15px;min-width:160px}
}
</style>
</head>
<body>

<header>
  <div class="container" style="display:flex;align-items:center;justify-content:space-between">
    <div class="brand">大洋<span>播客</span></div>
    <span class="header-tag">发现好播客</span>
  </div>
</header>

<main>
  <!-- Results Section -->
  <section class="results" id="results" aria-label="播客推荐" aria-live="polite" aria-atomic="true">
    <div class="container">
      <!-- Default: Empty state (shown on initial load, hidden after latest loads) -->
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🎲</div>
        <h2>欢迎来到大洋播客</h2>
        <p>浏览最新播客，或点击「随便听听」发现随机好内容</p>
      </div>

      <!-- Error state (hidden by default) -->
      <div class="error-state" id="errorState" hidden>
        <div class="empty-icon">⚠️</div>
        <h2>加载失败</h2>
        <p id="errorMessage">请稍后重试</p>
        <button class="retry-btn" id="retryBtn">重新加载</button>
      </div>

      <!-- 🎲 Random browse button — always visible, positioned above latest -->
      <div class="random-section" id="randomSection">
        <button class="random-btn" id="randomBtn" type="button">🎲 随便听听</button>
      </div>

      <hr class="section-divider" id="sectionDivider" hidden aria-hidden="true">

      <!-- Latest episodes heading (hidden by default, shown after autoFetchLatest) -->
      <div id="latestHeading" hidden aria-label="最新播客">
        <h2>最新播客</h2>
      </div>

      <!-- Latest cards container (hidden by default) -->
      <div id="cardsContainer" hidden aria-label="最新播客列表">
        <div class="cards" id="cardsList" role="list"></div>
        <div class="processing-info" id="processingInfo"></div>
      </div>

      <!-- Random results (hidden by default) -->
      <div id="randomResults" hidden aria-label="随机播客列表">
        <div class="cards" id="randomCards" role="list"></div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="container">大洋播客 · 发现好播客</div>
</footer>

<script>
(function() {
  'use strict';

  /* ---- DOM refs ---- */
  var DOM = {
    emptyState: document.getElementById('emptyState'),
    errorState: document.getElementById('errorState'),
    errorMessage: document.getElementById('errorMessage'),
    retryBtn: document.getElementById('retryBtn'),
    cardsContainer: document.getElementById('cardsContainer'),
    cardsList: document.getElementById('cardsList'),
    processingInfo: document.getElementById('processingInfo'),
    results: document.getElementById('results'),
    latestHeading: document.getElementById('latestHeading'),
    sectionDivider: document.getElementById('sectionDivider'),
    randomSection: document.getElementById('randomSection'),
    randomBtn: document.getElementById('randomBtn'),
    randomResults: document.getElementById('randomResults'),
    randomCards: document.getElementById('randomCards'),
  };

  var abortController = null;
  var latestWasLoaded = false;  // track whether latest data exists (for restore on random error)

  /* ---- State management ---- */

  function showError(message) {
    DOM.emptyState.hidden = true;
    DOM.cardsContainer.hidden = true;
    DOM.latestHeading.hidden = true;
    DOM.sectionDivider.hidden = true;
    DOM.randomResults.hidden = true;
    DOM.errorState.hidden = false;
    DOM.errorMessage.textContent = message || '加载失败，请稍后重试';
    DOM.randomBtn.disabled = false;
    DOM.randomBtn.textContent = '🎲 随便听听';
  }

  function showEmptyState(title, desc) {
    DOM.emptyState.hidden = false;
    DOM.errorState.hidden = true;
    DOM.cardsContainer.hidden = true;
    DOM.latestHeading.hidden = true;
    DOM.sectionDivider.hidden = true;
    DOM.randomResults.hidden = true;
    DOM.randomBtn.disabled = false;
    DOM.emptyState.querySelector('h2').textContent = title;
    DOM.emptyState.querySelector('p').textContent = desc;
  }

  function restoreLatestView() {
    DOM.emptyState.hidden = true;
    DOM.errorState.hidden = true;
    DOM.randomResults.hidden = true;
    DOM.latestHeading.hidden = false;
    DOM.cardsContainer.hidden = false;
    DOM.sectionDivider.hidden = false;
    DOM.randomBtn.disabled = false;
    DOM.randomBtn.textContent = '🎲 随便听听';
    DOM.results.setAttribute('aria-busy', 'false');
  }

  function restoreEmptyView() {
    DOM.emptyState.hidden = false;
    DOM.errorState.hidden = true;
    DOM.randomResults.hidden = true;
    DOM.latestHeading.hidden = true;
    DOM.cardsContainer.hidden = true;
    DOM.sectionDivider.hidden = true;
    DOM.randomBtn.disabled = false;
    DOM.randomBtn.textContent = '🎲 随便听听';
    DOM.results.setAttribute('aria-busy', 'false');
  }

  function renderCards(recs, targetList) {
    targetList.innerHTML = '';
    targetList.setAttribute('role', 'list');

    recs.forEach(function(rec, idx) {
      var card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('role', 'listitem');
      card.setAttribute('aria-posinset', idx + 1);
      card.setAttribute('aria-setsize', recs.length);

      var scoreLabel = '';
      if (rec.relevance_score != null) {
        var pct = Math.round(rec.relevance_score * 100);
        scoreLabel = '匹配 ' + pct + '%';
      }

      var durationStr = '';
      if (rec.duration_sec != null && rec.duration_sec > 0) {
        var mins = Math.floor(rec.duration_sec / 60);
        if (mins >= 60) {
          var h = Math.floor(mins / 60);
          var m = mins % 60;
          durationStr = h + '小时' + (m > 0 ? m + '分钟' : '');
        } else {
          durationStr = mins + '分钟';
        }
      }

      var dateStr = rec.published_at || '';
      if (dateStr) {
        try {
          var d = new Date(dateStr);
          if (!isNaN(d.getTime())) {
            dateStr = d.toLocaleDateString('zh-CN', {year:'numeric',month:'short',day:'numeric'});
          }
        } catch(e) {}
      }

      var hasTimestamps = rec.timestamps && rec.timestamps.length > 0;

      var html = '';

      /* Header */
      html += '<div class="card-header">';
      html += '  <div class="card-title">' + escapeHtml(rec.episode_title || '未命名播客') + '</div>';
      if (scoreLabel) {
        html += '  <span class="card-badge">' + scoreLabel + '</span>';
      }
      html += '</div>';

      /* Meta */
      html += '<div class="card-meta">';
      if (rec.show_title) {
        html += '  <span class="show-name">' + escapeHtml(rec.show_title) + '</span>';
        if (dateStr || durationStr) html += '  <span class="sep">·</span>';
      }
      if (dateStr) {
        html += '  <span>' + dateStr + '</span>';
        if (durationStr) html += '  <span class="sep">·</span>';
      }
      if (durationStr) html += '  <span>' + durationStr + '</span>';
      html += '</div>';

      /* Summary */
      if (rec.summary) {
        html += '<div class="card-summary">' + escapeHtml(rec.summary) + '</div>';
      }

      /* Reason */
      if (rec.reason) {
        html += '<div class="card-reason"><strong>推荐理由</strong> · ' + escapeHtml(rec.reason) + '</div>';
      }

      /* Timestamps */
      if (hasTimestamps) {
        var tsId = 'ts-' + idx;
        html += '<div class="timestamps-section">';
        html += '  <button class="timestamps-toggle" aria-expanded="false" aria-controls="' + tsId + '" data-ts-target="' + tsId + '">';
        html += '    <span class="arrow">▶</span> 关键时间戳 (' + rec.timestamps.length + ')';
        html += '  </button>';
        html += '  <ul class="timestamps-list" id="' + tsId + '" role="list">';
        rec.timestamps.forEach(function(ts) {
          html += '    <li>';
          html += '      <span class="ts-time">' + escapeHtml(ts.time_str || '') + '</span>';
          html += '      <span class="ts-label">' + escapeHtml(ts.label || '') + '</span>';
          html += '    </li>';
        });
        html += '  </ul>';
        html += '</div>';
      }

      /* Audio player */
      if (rec.audio_url) {
        html += '<div class="card-audio">';
        html += '  <audio controls preload="none" aria-label="播客音频播放器 - ' + escapeAttr(rec.episode_title || '') + '">';
        html += '    <source src="' + escapeAttr(rec.audio_url) + '" type="audio/mpeg">';
        html += '    您的浏览器不支持音频播放';
        html += '  </audio>';
        html += '</div>';
      }

      /* Listen button */
      if (rec.episode_url) {
        html += '<a class="listen-btn" href="' + escapeAttr(rec.episode_url) + '" target="_blank" rel="noopener noreferrer">';
        html += '  🎧 收听原播客';
        html += '</a>';
      }

      card.innerHTML = html;

      /* Attach timestamp toggle events */
      if (hasTimestamps) {
        var toggleBtn = card.querySelector('.timestamps-toggle');
        var tsList = card.querySelector('.timestamps-list');
        if (toggleBtn && tsList) {
          toggleBtn.addEventListener('click', function() {
            var expanded = toggleBtn.getAttribute('aria-expanded') === 'true';
            toggleBtn.setAttribute('aria-expanded', !expanded);
            tsList.classList.toggle('open');
          });
        }
      }

      targetList.appendChild(card);
    });
  }

  function showLatestCards(recs) {
    DOM.emptyState.hidden = true;
    DOM.errorState.hidden = true;
    DOM.latestHeading.hidden = false;
    DOM.cardsContainer.hidden = false;
    DOM.sectionDivider.hidden = false;
    DOM.processingInfo.hidden = true;
    DOM.results.setAttribute('aria-busy', 'false');
    renderCards(recs, DOM.cardsList);
    latestWasLoaded = true;
  }

  /* ---- Silent auto-fetch latest (no loading UI) ---- */
  function autoFetchLatest() {
    if (abortController) abortController.abort();
    abortController = new AbortController();

    var timeoutId = setTimeout(function() {
      if (abortController) {
        abortController.abort();
        abortController = null;
      }
      /* Timeout: stay on empty state silently */
    }, 10000);

    fetch('https://api.myagent.ccwu.cc/api/latest?limit=5', {
      headers: {'Accept': 'application/json'},
      signal: abortController.signal,
    })
    .then(function(response) {
      clearTimeout(timeoutId);
      if (!response.ok) throw new Error('服务器错误 (' + response.status + ')');
      return response.json();
    })
    .then(function(data) {
      abortController = null;
      var recs = data.recommendations || [];
      if (recs.length > 0) {
        showLatestCards(recs);
      }
      /* Empty result: stay on empty state, no change */
    })
    .catch(function(err) {
      abortController = null;
      clearTimeout(timeoutId);
      if (err.name === 'AbortError') return;
      /* Fetch failed silently — stay on empty state */
    });
  }

  /* ---- Random fetch ---- */
  function fetchRandom() {
    /* Cancel any in-flight random fetch */
    if (abortController) abortController.abort();
    abortController = new AbortController();

    /* Disable button for loading state */
    DOM.randomBtn.disabled = true;
    DOM.randomBtn.textContent = '正在加载…';
    DOM.results.setAttribute('aria-busy', 'true');

    /* Hide latest section */
    DOM.latestHeading.hidden = true;
    DOM.cardsContainer.hidden = true;
    DOM.sectionDivider.hidden = true;

    /* Hide previous random results and empty/error states */
    DOM.randomResults.hidden = true;
    DOM.emptyState.hidden = true;
    DOM.errorState.hidden = true;

    var timeoutId = setTimeout(function() {
      if (abortController) {
        abortController.abort();
        abortController = null;
      }
      /* Timeout: restore previous view silently */
      DOM.randomBtn.disabled = false;
      DOM.randomBtn.textContent = '🎲 随便听听';
      DOM.results.setAttribute('aria-busy', 'false');
      if (latestWasLoaded) {
        restoreLatestView();
      } else {
        restoreEmptyView();
      }
    }, 10000);

    fetch('https://api.myagent.ccwu.cc/api/random', {
      headers: { 'Accept': 'application/json' },
      signal: abortController.signal,
    })
    .then(function(response) {
      clearTimeout(timeoutId);
      if (!response.ok) throw new Error('服务器错误 (' + response.status + ')');
      return response.json();
    })
    .then(function(data) {
      abortController = null;
      clearTimeout(timeoutId);
      DOM.randomBtn.disabled = false;
      DOM.randomBtn.textContent = '🎲 随便听听';

      var recs = data.recommendations || [];
      if (recs.length === 0) {
        /* Empty random results — restore previous view */
        if (latestWasLoaded) {
          restoreLatestView();
        } else {
          restoreEmptyView();
        }
      } else {
        /* Show random cards (max 4) */
        var showRecs = recs.slice(0, 4);
        renderCards(showRecs, DOM.randomCards);
        DOM.randomResults.hidden = false;
        DOM.results.setAttribute('aria-busy', 'false');
      }
    })
    .catch(function(err) {
      abortController = null;
      clearTimeout(timeoutId);
      DOM.randomBtn.disabled = false;
      DOM.randomBtn.textContent = '🎲 随便听听';
      if (err.name === 'AbortError') return;
      /* On error: restore latest if available, otherwise empty state */
      if (latestWasLoaded) {
        restoreLatestView();
      } else {
        restoreEmptyView();
      }
    });
  }

  /* ---- Event handlers ---- */
  DOM.retryBtn.addEventListener('click', function() {
    autoFetchLatest();
  });

  DOM.randomBtn.addEventListener('click', function() {
    fetchRandom();
  });

  /* ---- Utility ---- */
  function escapeHtml(str) {
    if (typeof str !== 'string') return str;
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  function escapeAttr(str) {
    if (typeof str !== 'string') return '';
    return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  /* Init: auto-fetch latest silently on page load */
  document.addEventListener('DOMContentLoaded', function() {
    autoFetchLatest();
  });

})();
</script>
</body>
