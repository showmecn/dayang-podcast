# Dayang Podcast — Daily Episode Refresh
# Runs at UTC+8 02:00 (18:00 UTC) every day
name: Daily Refresh

on:
  schedule:
    - cron: "0 18 * * *"  # 18:00 UTC = 02:00 UTC+8
  workflow_dispatch:       # Allow manual trigger

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  REDIS_URL: ${{ secrets.REDIS_URL }}
  PODCAST_INDEX_API_KEY: ${{ secrets.PODCAST_INDEX_API_KEY }}
  PODCAST_INDEX_API_SECRET: ${{ secrets.PODCAST_INDEX_API_SECRET }}

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily refresh
        run: python -m app.scheduler.daily_refresh
